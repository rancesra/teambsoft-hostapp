# Integración de la Tienda Virtual: los tres backends, sus bases de datos, un solo RabbitMQ, un solo
# Kong, Keycloak y Eureka (contrato de Catálogo v2.4, sección 10). Lo opera el Equipo B.
#
# Cada servicio se construye desde el repositorio de GitHub de su equipo: nadie copia código de otro.
# Los cuatro frontends (el Host App y los módulos de Catálogo, Búsqueda y Carrito) también van aquí,
# compilados y servidos con "vite preview" (contrato del Host App v1.4, sección 9).
#
# Dos formas de usarlo (detalle en README.md):
# - En este computador: copiar .env.example a .env, llenar las credenciales y correr
#   "docker compose up -d --build". La tienda queda en http://localhost:5050.
# - Publicada en internet: además, llenar las direcciones públicas y el token del túnel en el .env y
#   correr "docker compose --profile publico up -d --build". La tienda queda en https://tienda.<dominio>.

name: tienda-integracion

# El Dockerfile de los cuatro frontends. Instala, compila con las variables VITE_ que le pasa cada
# servicio y sirve el resultado con "vite preview". La configuración extra (vite.despliegue.config.mjs)
# se suma a la del equipo: deja entrar con cualquier nombre de host (los subdominios) y reenvía /api a Kong.
x-dockerfile-frontend: &dockerfile-frontend |
  FROM node:22-alpine
  WORKDIR /app
  COPY . .
  # Si se construye desde una carpeta local, se descarta su node_modules (puede ser de otro sistema).
  RUN rm -rf node_modules dist && npm ci --no-audit --no-fund
  ARG VITE_MODULO_CATALOGO
  ARG VITE_MODULO_BUSQUEDA
  ARG VITE_MODULO_CARRO
  ARG VITE_KEYCLOAK_URL
  ARG VITE_HOST_APP
  ARG VITE_API_URL
  RUN npx vite build
  COPY <<'FIN' vite.despliegue.config.mjs
  import { mergeConfig } from 'vite'
  import base from './vite.config.js'
  export default mergeConfig(base, {
    preview: {
      host: true,
      port: Number(process.env.PUERTO),
      strictPort: true,
      allowedHosts: true,
      proxy: { '/api': { target: 'http://kong:8000', changeOrigin: true } },
    },
  })
  FIN
  CMD ["npx", "vite", "preview", "--config", "vite.despliegue.config.mjs"]

x-servicio-frontend: &servicio-frontend
  depends_on:
    - kong
  restart: unless-stopped

services:

  # --- Compartido --------------------------------------------------------------------------------

  # El único RabbitMQ (sección 10.1). Catálogo publica en el exchange catalogo.eventos y Búsqueda
  # consume de él.
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    # Sin esto, en algunas versiones de Docker Erlang escribe su cookie como root y RabbitMQ no la puede leer.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
      # Solo la consola web, y solo en este computador.
      - "127.0.0.1:${RABBIT_CONSOLA_PUERTO:-15672}:15672"
    volumes:
      - rabbit-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # El único Kong (sección 10.2), sin base de datos: las rutas y el CORS están en kong.yml.
  # No depende de los backends a propósito: si uno no arranca, las rutas de los otros siguen
  # funcionando, y la del caído responde 502/503 hasta que vuelva.
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_PUERTO:-8000}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # El login (contrato del Host App v1.3, sección 5). Al arrancar importa el realm "tienda" de
  # keycloak/realm-tienda.json, que es una copia del que está en el repositorio del backend: roles
  # admin y cliente, el cliente tienda-web del navegador y dos usuarios de prueba. No guarda nada
  # entre reinicios. El navegador llega en http://localhost:8180 (publicada, en https://login.<dominio>);
  # los servicios, en http://keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # El emisor de los tokens queda fijo en la dirección del navegador, aunque un servicio llegue
      # por http://keycloak:8080.
      # Publicada, es https://login.<dominio>. El túnel le avisa que la conexión original era HTTPS con
      # los encabezados X-Forwarded-*.
      KC_HOSTNAME: ${URL_LOGIN:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      # El realm (keycloak/realm-tienda.json) toma de aquí las direcciones a las que puede volver el
      # login y las claves de los usuarios de prueba. Sin valor, usa las de localhost y admin123 / cliente123.
      URL_TIENDA: ${URL_TIENDA:-http://localhost:5050}
      URL_CATALOGO_WEB: ${URL_CATALOGO_WEB:-http://localhost:5173}
      CLAVE_ADMIN_TIENDA: ${CLAVE_ADMIN_TIENDA:-admin123}
      CLAVE_CLIENTE_TIENDA: ${CLAVE_CLIENTE_TIENDA:-cliente123}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # La imagen no trae curl: se pregunta por el puerto de administración (9000) con bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # El registro de servicios (Eureka). Cada microservicio se anuncia al arrancar con su nombre, su IP
  # y su puerto, y renueva su registro cada 10 segundos; si deja de hacerlo, sale de la lista. El
  # estado (UP o DOWN) sale del /actuator/health del servicio. Consola en http://localhost:8761.
  # Se construye desde la carpeta eureka/ del repositorio del backend.
  eureka:
    build:
      context: ${EUREKA_CONTEXTO:-https://github.com/rancesra/teambsoft-backend.git#main:eureka}
    ports:
      # Solo en este computador.
      - "127.0.0.1:${EUREKA_PUERTO:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Catálogo (Equipo B) -----------------------------------------------------------------------

  catalogo:
    build:
      context: ${CATALOGO_CONTEXTO:-https://github.com/rancesra/teambsoft-backend.git#main}
    environment:
      # El perfil integracion carga los productos de prueba con ids fijos (sección 10.5).
      SPRING_PROFILES_ACTIVE: integracion
      SPRING_MONGODB_URI: mongodb://catalogo-mongo:27017/catalogo
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Se registra en Eureka con el nombre "catalogo" (spring.application.name).
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      # Contrato v2.5: Catálogo descarga la llave de Keycloak por la red de Docker. El emisor de los
      # tokens es la dirección con la que el navegador inicia sesión (la misma de KC_HOSTNAME).
      KEYCLOAK_LLAVES: http://keycloak:8080/realms/tienda/protocol/openid-connect/certs
      KEYCLOAK_EMISOR: ${URL_LOGIN:-http://localhost:8180}/realms/tienda
    depends_on:
      catalogo-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
      # Catálogo arranca después de Búsqueda para que la cola de Búsqueda ya exista cuando salgan los
      # eventos de los productos de prueba (sección 10.5). Basta con que haya arrancado, no con que
      # esté sana: si Búsqueda falla, Catálogo arranca igual. Spring tarda más en arrancar que lo que
      # tarda Búsqueda en enlazar su cola.
      busqueda:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  catalogo-mongo:
    image: mongo:7.0
    volumes:
      - catalogo-mongo-datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Búsqueda (Equipo A) -----------------------------------------------------------------------

  busqueda:
    build:
      context: ${BUSQUEDA_CONTEXTO:-https://github.com/Tavolistar/Grupoa_Busqueda.git#main}
    environment:
      PORT: "3000"
      ELASTICSEARCH_URL: http://busqueda-elasticsearch:9200
      REDIS_URL: redis://busqueda-redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Se registra en Eureka como "busqueda" (si su versión ya trae el registro; si no, la ignora).
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      busqueda-elasticsearch:
        condition: service_healthy
      busqueda-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Búsqueda no tiene endpoint de salud: abre el puerto 3000 solo después de crear el índice y
    # enlazar su cola, así que "el puerto responde" es una buena señal de que está lista.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  busqueda-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - busqueda-es-datos:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  busqueda-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Carrito (Equipo C) ------------------------------------------------------------------------

  carrito:
    build:
      context: ${CARRITO_CONTEXTO:-https://github.com/camiloherrera-dev/PROYECTO-ING-SOFTWARE-II.git#develop}
      # La imagen de producción del Equipo C (su compromiso C1). Trae su propio healthcheck (/health).
      target: prod
    environment:
      PORT: "3000"
      REDIS_URL: redis://carrito-redis:6379
      DATABASE_URL: postgres://carrito:carrito_dev@carrito-postgres:5432/carrito
      # Carrito llama a Catálogo por Kong (contrato de integración del Equipo C, sección 3).
      CATALOG_BASE_URL: http://kong:8000/api/catalogo
      # La imagen de producción no acepta el secreto de desarrollo: hay que definir uno.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # El login real (contrato del Host App v1.3): con esto Carrito acepta también el token de
      # Keycloak, si su versión ya lo soporta (requerimiento C5). Si no, lo ignora y sigue con JWT_SECRET.
      KEYCLOAK_LLAVES: http://keycloak:8080/realms/tienda/protocol/openid-connect/certs
      KEYCLOAK_EMISOR: ${URL_LOGIN:-http://localhost:8180}/realms/tienda
      # Se registra en Eureka como "carrito" (si su versión ya trae el registro; si no, la ignora).
      EUREKA_URL: http://eureka:8761/eureka
    depends_on:
      carrito-redis:
        condition: service_healthy
      carrito-postgres:
        condition: service_healthy
    restart: unless-stopped

  carrito-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  carrito-postgres:
    image: postgres:16-alpine
    # Credenciales de desarrollo, las mismas del docker-compose del Equipo C. La base no se publica
    # fuera de la red de Docker.
    environment:
      POSTGRES_USER: carrito
      POSTGRES_PASSWORD: carrito_dev
      POSTGRES_DB: carrito
    volumes:
      - carrito-postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrito -d carrito"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Frontends ---------------------------------------------------------------------------------
  #
  # Cada frontend se construye desde el repositorio de su equipo con el mismo Dockerfile (el de arriba,
  # x-frontend), sin agregarle archivos a nadie. Las direcciones se fijan al compilar (variables VITE_)
  # y salen del .env: localhost en este computador, los subdominios cuando se publica.
  # Las llamadas a /api las reenvía cada frontend a Kong por dentro de Docker, así que el navegador
  # nunca sale de su propio origen y no hace falta CORS.

  hostapp:
    build:
      context: ${HOSTAPP_CONTEXTO:-https://github.com/rancesra/teambsoft-hostapp.git#main}
      dockerfile_inline: *dockerfile-frontend
      args:
        VITE_MODULO_CATALOGO: ${URL_CATALOGO_WEB:-http://localhost:5173}
        VITE_MODULO_BUSQUEDA: ${URL_BUSQUEDA_WEB:-http://localhost:5174}
        VITE_MODULO_CARRO: ${URL_CARRO_WEB:-http://localhost:5175}
        VITE_KEYCLOAK_URL: ${URL_LOGIN:-http://localhost:8180}/realms/tienda
    environment:
      PUERTO: "5050"
    ports:
      - "127.0.0.1:5050:5050"
    <<: *servicio-frontend

  catalogo-web:
    build:
      context: ${CATALOGO_WEB_CONTEXTO:-https://github.com/rancesra/teambsoft-frontend.git#main}
      dockerfile_inline: *dockerfile-frontend
      args:
        VITE_KEYCLOAK_URL: ${URL_LOGIN:-http://localhost:8180}/realms/tienda
        VITE_HOST_APP: ${URL_TIENDA:-http://localhost:5050}
    environment:
      PUERTO: "5173"
    ports:
      - "127.0.0.1:${CATALOGO_WEB_PUERTO:-5173}:5173"
    <<: *servicio-frontend

  busqueda-web:
    build:
      context: ${BUSQUEDA_WEB_CONTEXTO:-https://github.com/Tavolistar/Grupoa_Busqueda.git#main:busqueda-frontend}
      dockerfile_inline: *dockerfile-frontend
      args:
        # Relativa: el navegador llama a su propio origen y el frontend la reenvía a Kong.
        VITE_API_URL: /api/busqueda
    environment:
      PUERTO: "5174"
    ports:
      - "127.0.0.1:5174:5174"
    <<: *servicio-frontend

  carrito-web:
    build:
      context: ${CARRITO_WEB_CONTEXTO:-https://github.com/camiloherrera-dev/PROYECTO-ING-SOFTWARE-II.git#develop:Frontend}
      dockerfile_inline: *dockerfile-frontend
      args:
        VITE_HOST_APP: ${URL_TIENDA:-http://localhost:5050}
    environment:
      PUERTO: "5175"
    ports:
      - "127.0.0.1:5175:5175"
    <<: *servicio-frontend

  # --- Publicación en internet (solo con --profile publico) ---------------------------------------
  #
  # El túnel de Cloudflare (ARQUITECTURA-CATALOGO v1.8): sale de este computador hacia Cloudflare, que
  # publica los subdominios con HTTPS y los trae de vuelta por el túnel. No se abre ningún puerto del
  # router. A qué servicio va cada subdominio se configura en el panel de Cloudflare (README.md).
  tunel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [publico]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNEL_TOKEN:-}
    depends_on:
      - hostapp
      - catalogo-web
      - busqueda-web
      - carrito-web
      - keycloak
    restart: unless-stopped

volumes:
  rabbit-datos:
  catalogo-mongo-datos:
  busqueda-es-datos:
  carrito-postgres-datos:

# Kong de la integración (contrato de Catálogo v2.4, sección 10.2). Modo declarativo, sin base de
# datos: Kong lee este archivo al arrancar. Para cambiar una ruta o el CORS, primero se cambia el
# contrato y después este archivo.
_format_version: "3.0"

services:

  - name: catalogo
    url: http://catalogo:8080
    routes:
      - name: catalogo
        paths: [/api/catalogo]
        # Los controllers de Catálogo no llevan el prefijo: Kong lo quita.
        # /api/catalogo/productos llega como /productos.
        strip_path: true

  - name: busqueda
    url: http://busqueda:3000
    routes:
      - name: busqueda
        paths: [/api/busqueda]
        # Las rutas de Búsqueda ya empiezan por /api/busqueda: Kong no lo quita.
        strip_path: false

  - name: carrito
    url: http://carrito:3000
    routes:
      - name: carrito
        paths: [/api/carrito]
        # Las rutas de Carrito ya empiezan por /api/carrito: Kong no lo quita.
        strip_path: false

# Un plugin declarado aquí, fuera de cualquier servicio, es global: aplica a las tres rutas.
plugins:
  - name: cors
    config:
      # Los cuatro frontends (sección 10.4), uno por uno, sin comodines.
      origins:
        - http://localhost:5173
        - http://localhost:5174
        - http://localhost:5175
        - http://localhost:5050
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type]
      # Para que el frontend de Carrito pueda leer su límite de peticiones (429).
      exposed_headers: [X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After]
      # El navegador guarda la respuesta al OPTIONS una hora.
      max_age: 3600
